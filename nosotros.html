<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosotros | Tecnilight</title>
    <meta name="description" content="Conoce más sobre Tecnilight, especialistas en herrería artística e iluminación.">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
    <script src="layout.js" defer></script>
    <script src="app.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Contenedor principal a pantalla completa */
        .nosotros-content {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            align-items: center;
        }

        /* Banners ocupando el 100% del ancho */
        .banner-item {
            width: 100%;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .banner-item:hover {
            transform: scale(1.005);
        }

        .banner-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Botones de Contacto centrados con margen de protección */
        .contacto-acciones {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin: 2rem 0;
            width: 100%;
            padding: 0 1rem;
        }

        /* Resets e imágenes dentro de picture */
        .banner-item picture,
        .banner-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Ajustes opcionales para vista móvil */
        @media (max-width: 768px) {
            .nosotros-content {
                width: 100%;
                margin-left: 0;
                margin-right: 0;
                left: 0;
                right: 0;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="section" style="padding-left: 0; padding-right: 0; overflow-x: hidden;">
            <div class="container" style="max-width: 100%; padding: 0;">

                <div class="nosotros-content">
                   <!-- Banner 1: ¿Quiénes Somos? -->
                <div class="banner-item">
                    <picture>
                        <source media="(max-width: 768px)" srcset="assets/img/banner-vertical-quienes-somos.jpg">
                        <img src="assets/img/banner-quienes-somos.jpg" alt="¿Quiénes Somos? Tecnilight" loading="lazy">
                    </picture>
                </div>

                <!-- Banner 2: Calidad y Excelencia -->
                <div class="banner-item">
                    <picture>
                        <source media="(max-width: 768px)" srcset="assets/img/banner-vertical-calidad.jpg">
                        <img src="assets/img/banner-calidad.jpg" alt="Calidad y Excelencia Tecnilight" loading="lazy">
                    </picture>
                </div>

                <!-- Banner 3: Servicios -->
                <div class="banner-item">
                    <picture>
                        <source media="(max-width: 768px)" srcset="assets/img/banner-vertical-servicios.jpg">
                        <img src="assets/img/banner-servicios.jpg" alt="Servicios Tecnilight" loading="lazy">
                    </picture>
                </div>

                    <!-- Botones de Contacto Directos -->
                    <div class="contacto-acciones">
                        <a href="https://wa.me/522214353123" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">

                        <a href="catalogo.html" class="btn btn-neon-rojo">

                            Ver Catálogo
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="estatica.js"></script>
</body>
</html>
