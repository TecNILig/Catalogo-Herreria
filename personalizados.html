<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizar Personalizado | Tecnilight</title>
    <meta name="description" content="Solicita una cotización personalizada para tu proyecto de herrería.">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
    <script src="layout.js" defer></script>
    <script src="app.js" defer></script>
    <style>
        .form-personalizado {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e94560;
        }
        .dimensiones-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        .btn-enviar {
            width: 100%;
            padding: 1rem;
            background: #25d366;
            color: #fff;
            font-size: 1.125rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-enviar:hover {
            background: #128c7e;
        }
        @media (max-width: 600px) {
            .dimensiones-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="section">
            <div class="container">
                <h1 class="section-title">Cotización <span>Personalizada</span></h1>
                <p style="text-align: center; max-width: 600px; margin: -1rem auto 2rem; color: #666;">
                    Describe tu proyecto y te enviaremos una cotización detallada por WhatsApp.
                </p>

                <form class="form-personalizado" onsubmit="enviarCotizacion(event)">
                    <div class="dimensiones-grid">
                        <div class="form-group">
                            <label for="alto">Alto (metros) *</label>
                            <input type="number" id="alto" step="0.01" min="0" required placeholder="Ej: 2.5">
                        </div>
                        <div class="form-group">
                            <label for="ancho">Ancho (metros) *</label>
                            <input type="number" id="ancho" step="0.01" min="0" required placeholder="Ej: 1.5">
                        </div>
                        <div class="form-group">
                            <label for="largo">Largo (metros) *</label>
                            <input type="number" id="largo" step="0.01" min="0" required placeholder="Ej: 0.5">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción del proyecto *</label>
                        <textarea id="descripcion" rows="5" required placeholder="Describe el diseño, materiales, colores, o adjunta una referencia..."></textarea>
                    </div>

                    <button type="submit" class="btn-enviar" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                        Enviar por WhatsApp
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script>
        function enviarCotizacion(event) {
            event.preventDefault();
            
            const alto = document.getElementById('alto').value;
            const ancho = document.getElementById('ancho').value;
            const largo = document.getElementById('largo').value;
            const descripcion = document.getElementById('descripcion').value;

            const app = window.TecnilightApp;
            const link = app.generarLinkWhatsAppPersonalizado({
                alto, ancho, largo, descripcion
            });

            window.open(link, '_blank');
        }
    </script>
</body>
</html>
