<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto | Tecnilight</title>
    <meta name="description" content="Detalle del producto seleccionado.">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
    <script src="layout.js" defer></script>
    <script src="app.js" defer></script>
    <style>
        .producto-detalle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: start;
        }
        .producto-galeria {
            background: transparent; /* Fondo transparente para no tener el cuadro blanco */
            position: relative;
        }
        .galeria-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333333; /* Borde sutil oscuro */
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }
        .galeria-flecha {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            border: 1px solid #555;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s;
            z-index: 10;
        }
        .galeria-flecha:hover {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        .galeria-flecha.prev {
            left: 15px;
        }
        .galeria-flecha.next {
            right: 15px;
        }
        .producto-galeria img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
        }
        
        /* Panel derecho oscuro */
        .producto-info-detalle {
            background: #111111; /* Fondo oscuro */
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #333333;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }
        .producto-categoria {
            color: #aaaaaa; /* Gris claro */
            text-transform: uppercase;
            font-size: 0.875rem;
            letter-spacing: 1px;
        }
        .producto-info-detalle h1 {
            font-size: 2rem;
            color: #ffffff; /* Título blanco */
            margin-bottom: 0.5rem;
        }
        
        /* Caja de especificaciones con neón rojo */
        .producto-especificaciones {
            margin: 1.5rem 0;
            padding: 1.5rem;
            background: #000000; /* Fondo negro */
            border-radius: 8px;
            border: 1px solid #333333;
            border-left: 3px solid #ff0000; /* Acento rojo patrio */
            box-shadow: -4px 0 12px rgba(255, 0, 0, 0.2);
        }
        .producto-especificaciones h3 {
            margin-bottom: 1rem;
            color: #ffffff;
        }
        .espec-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
        .espec-item {
            display: flex;
            justify-content: space-between;
        }
        .espec-label {
            color: #cccccc;
        }
        .espec-valor {
            font-weight: 600;
            color: #ffffff;
        }
        
        /* Botón WhatsApp Neón */
        .btn-cotizar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 1rem;
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 255, 0, 0.3);
            text-shadow: 0 0 5px #00ff00;
            font-size: 1.125rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .btn-cotizar:hover {
            background: #00ff00;
            color: #000000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6), inset 0 0 15px rgba(0, 255, 0, 0.6);
            text-shadow: none;
            transform: translateY(-2px);
        }
        
        /* Galería de miniaturas */
        .miniaturas {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 0;
            overflow-x: auto;
        }
        .miniatura {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            background: #000;
            transition: all 0.3s;
        }
        .miniatura:hover,
        .miniatura.active {
            border-color: #ffffff; /* Borde blanco brillante para la miniatura activa */
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }
        
        @media (max-width: 768px) {
            .producto-detalle {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="section">
            <div class="container">
                <div id="producto-container">
                    <p style="text-align: center; color: #666;">Cargando producto...</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        let productoActual = null;
        let imagenesArray = [];
        let imagenIndexActual = 0;

        function actualizarImagenPrincipal() {
            if (imagenesArray.length === 0) return;
            const img = document.getElementById('imagen-principal');
            if (img) {
                img.src = imagenesArray[imagenIndexActual].url_imagen;
            }
            // Actualizar miniaturas activas
            document.querySelectorAll('.miniatura').forEach((m, i) => {
                m.classList.toggle('active', i === imagenIndexActual);
            });
        }

        function cambiarImagenAnterior() {
            if (imagenesArray.length === 0) return;
            imagenIndexActual = (imagenIndexActual - 1 + imagenesArray.length) % imagenesArray.length;
            actualizarImagenPrincipal();
        }

        function cambiarImagenSiguiente() {
            if (imagenesArray.length === 0) return;
            imagenIndexActual = (imagenIndexActual + 1) % imagenesArray.length;
            actualizarImagenPrincipal();
        }

        function cambiarImagenPorIndex(index) {
            if (index < 0 || index >= imagenesArray.length) return;
            imagenIndexActual = index;
            actualizarImagenPrincipal();
        }

        async function cargarProducto() {
            const app = window.TecnilightApp;
            const slug = app.obtenerParametroURL('articulo');
            const container = document.getElementById('producto-container');
            
            if (!slug) {
                container.innerHTML = '<p style="text-align: center;">Producto no especificado.</p>';
                return;
            }

            const producto = await app.obtenerProductoPorSlug(slug);
            productoActual = producto;
            
            if (!producto) {
                container.innerHTML = '<p style="text-align: center;">Producto no encontrado.</p>';
                return;
            }

            const imagenes = producto.imagenes_producto || [];
            imagenesArray = imagenes;
            imagenIndexActual = 0;
            const imagenPrincipal = imagenes.find(img => img.es_portada)?.url_imagen 
                || imagenes[0]?.url_imagen 
                || 'assets/img/placeholder.jpg';
            
            const whatsappLink = app.generarLinkWhatsApp(producto);

            container.innerHTML = `
                <div class="producto-detalle">
                    <div class="producto-galeria">
                        <div class="galeria-container">
                            <img id="imagen-principal" src="${imagenPrincipal}" alt="${producto.nombre}">
                            ${imagenes.length > 1 ? `
                                <button class="galeria-flecha prev" onclick="cambiarImagenAnterior()">‹</button>
                                <button class="galeria-flecha next" onclick="cambiarImagenSiguiente()">›</button>
                            ` : ''}
                        </div>
                        ${imagenes.length > 1 ? `
                            <div class="miniaturas">
                                ${imagenes.map((img, i) => `
                                    <img src="${img.url_imagen}" class="miniatura ${i === 0 ? 'active' : ''}" 
                                         onclick="cambiarImagenPorIndex(${i})" data-index="${i}" alt="">
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="producto-info-detalle">
                        <span class="producto-categoria">${producto.categorias?.nombre || 'General'}</span>
                        <h1>${producto.nombre}</h1>
                        
                        ${producto.alto_metros || producto.ancho_metros || producto.largo_metros || producto.tamano_etiqueta || producto.descripcion ? `
                            <div class="producto-especificaciones">
                                <h3>Especificaciones</h3>
                                
                                ${producto.descripcion ? `
                                    <div class="espec-descripcion" style="margin-bottom: 1rem; padding: 1rem; background: #111111; border-radius: 6px; border-left: 3px solid #00ff00; box-shadow: -4px 0 10px rgba(0,255,0,0.1);">
                                        <span class="espec-label" style="display: block; margin-bottom: 0.25rem; font-weight: 600; color: #cccccc;">Descripción:</span>
                                        <span class="espec-valor" style="color: #ffffff; line-height: 1.6;">${producto.descripcion}</span>
                                    </div>
                                ` : ''}
                                
                                <div class="espec-grid">
                                    ${producto.alto_metros ? `
                                        <div class="espec-item">
                                            <span class="espec-label">Alto:</span>
                                            <span class="espec-valor">${producto.alto_metros} m</span>
                                        </div>
                                    ` : ''}
                                    ${producto.ancho_metros ? `
                                        <div class="espec-item">
                                            <span class="espec-label">Ancho:</span>
                                            <span class="espec-valor">${producto.ancho_metros} m</span>
                                        </div>
                                    ` : ''}
                                    ${producto.largo_metros ? `
                                        <div class="espec-item">
                                            <span class="espec-label">Largo:</span>
                                            <span class="espec-valor">${producto.largo_metros} m</span>
                                        </div>
                                    ` : ''}
                                    ${producto.tamano_etiqueta ? `
                                        <div class="espec-item">
                                            <span class="espec-label">Tamaño:</span>
                                            <span class="espec-valor">${producto.tamano_etiqueta}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        ` : ''}
                        
                        <a href="${whatsappLink}" target="_blank" class="btn-cotizar">
                            <svg viewBox="0 0 24 24" width="22" height="22" style="margin-right: 4px;"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                            Cotizar por WhatsApp
                        </a>
                        
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', cargarProducto);
    </script>
</body>
</html>
